# XLM-R base, joint ar-SA + en-US training.
model_name: xlm-roberta-base
run_name: xlmr-base
output_dir: results/runs

max_length: 64          # verify with the token-length check printed by train.py
batch_size: 32
eval_batch_size: 128
learning_rate: 3.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
epochs: 5
patience: 2             # early stopping on dev macro-F1
seed: 42
fp16: true              # only used when running on CUDA